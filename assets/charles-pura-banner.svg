<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Charles Pura — Full-Stack Developer</title>
  <desc id="banner-description">Charles Pura, a full-stack developer based in Quezon City, Philippines. Web applications. Thoughtful interfaces. A subtle grid and layered code window decorate the monochrome banner, with gently animated code lines and connection signals.</desc>

  <style>:root{--bg:#0B0D10;--panel:#111419;--soft:#181C22;--text:#F4F4F2;--muted:#A6ABB4;--detail:#D8DADE;--line:rgba(255,255,255,0.13);--edge:rgba(255,255,255,0.3);--l0:#181C22;--l1:#3B3F46;--l2:#656971;--l3:#A6ABB4;--l4:#F4F4F2;--s0:#F4F4F2;--s1:#D8DADE;--s2:#C5C8CD;--s3:#A6ABB4;--s4:#92969E;--s5:#737984;--s6:#656971}@media(prefers-color-scheme:light){:root{--bg:#F4F4F1;--panel:#FFFFFF;--soft:#F0F0ED;--text:#101114;--muted:#656971;--detail:#656971;--line:rgba(16,17,20,0.14);--edge:rgba(16,17,20,0.3);--l0:#F0F0ED;--l1:#C5C8CD;--l2:#92969E;--l3:#656971;--l4:#101114;--s0:#101114;--s1:#282A30;--s2:#41454D;--s3:#656971;--s4:#737984;--s5:#92969E;--s6:#A6ABB4}}

    .code-progress { transform-box: fill-box; transform-origin: left center; animation: code-progress 7s ease-in-out infinite; }
    .code-secondary { animation-delay: 0.5s; }
    .signal { animation: signal 4s ease-in-out infinite; }
    .signal-second { animation-delay: 1.2s; }
    .code-cursor { animation: cursor 2.4s ease-in-out infinite; }
    @keyframes code-progress {
      0%, 8%, 100% { transform: scaleX(0.64); opacity: 0.45; }
      35%, 78% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes signal {
      0%, 100% { opacity: 0.3; }
      40%, 60% { opacity: 1; }
    }
    @keyframes cursor {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .code-progress, .signal, .code-cursor { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--bg)"/>
      <stop offset="1" stop-color="var(--panel)"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--muted)"/>
      <stop offset="1" stop-color="var(--text)"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="var(--muted)" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="banner-clip">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect x="704" width="496" height="360" fill="url(#grid)"/>
    <path d="M704 0V360" stroke="var(--muted)" stroke-opacity="0.06"/>
    <path d="M64 359H1136" stroke="url(#accent)" stroke-opacity="0.5"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <circle cx="69" cy="69" r="4" fill="var(--text)"/>
      <text x="84" y="74" fill="var(--muted)" font-size="15" letter-spacing="1.1">QUEZON CITY, PHILIPPINES</text>
      <text x="60" y="151" fill="var(--text)" font-size="66" font-weight="700" letter-spacing="-2">Charles Pura</text>
      <text x="64" y="198" fill="var(--muted)" font-size="27" font-weight="600">Full-Stack Developer</text>
      <text x="64" y="245" fill="var(--detail)" font-size="22">Web applications. Thoughtful interfaces.</text>
    </g>

    <path d="M64 290H108" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="295" fill="var(--muted)" font-family="Consolas, Courier New, monospace" font-size="13" letter-spacing="1.2">CHARLESPURA / GITHUB</text>

    <g aria-hidden="true">
      <rect x="798" y="57" width="338" height="216" rx="13" fill="var(--soft)" stroke="var(--line)"/>
      <rect x="782" y="70" width="338" height="216" rx="13" fill="var(--soft)" stroke="var(--edge)"/>
      <rect x="766" y="83" width="338" height="216" rx="13" fill="var(--panel)" stroke="var(--edge)"/>
      <path d="M766 121H1104" stroke="var(--line)"/>

      <circle cx="786" cy="102" r="3.5" fill="var(--muted)"/>
      <circle cx="799" cy="102" r="3.5" fill="var(--muted)"/>
      <circle cx="812" cy="102" r="3.5" fill="var(--muted)"/>
      <text x="1084" y="106" text-anchor="end" fill="var(--muted)" font-family="Consolas, Courier New, monospace" font-size="11" letter-spacing="0.8">BUILD / CREATE / REFINE</text>

      <path d="M809 157L795 170L809 183M847 157L861 170L847 183M835 151L821 189" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="code-progress" x="889" y="157" width="104" height="6" rx="3" fill="var(--text)" fill-opacity="0.8"/>
      <rect x="889" y="172" width="174" height="5" rx="2.5" fill="var(--l1)"/>
      <rect class="code-progress code-secondary" x="889" y="186" width="132" height="5" rx="2.5" fill="var(--l1)"/>
      <rect class="code-cursor" x="1070" y="168" width="3" height="12" rx="1.5" fill="var(--text)"/>

      <path d="M795 217H1075" stroke="var(--line)"/>
      <path d="M846 246H935M935 246H1024" stroke="var(--edge)"/>
      <circle class="signal" cx="891" cy="246" r="3" fill="var(--text)"/>
      <circle class="signal signal-second" cx="980" cy="246" r="3" fill="var(--muted)"/>

      <rect x="795" y="230" width="67" height="32" rx="6" fill="var(--soft)" stroke="var(--edge)"/>
      <rect x="902" y="230" width="67" height="32" rx="6" fill="var(--soft)" stroke="var(--edge)"/>
      <rect x="1009" y="230" width="67" height="32" rx="6" fill="var(--soft)" stroke="var(--edge)"/>
      <g font-family="Consolas, Courier New, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
        <text x="828.5" y="250" fill="var(--muted)">UI</text>
        <text x="935.5" y="250" fill="var(--text)">API</text>
        <text x="1042.5" y="250" fill="var(--muted)">DATA</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" stroke="var(--line)"/>
</svg>
